# Standard distribution URL so a fresh clone builds anywhere, CI included.
#
# The original build machine works offline and keeps an unpacked copy under .toolchain/; if you
# need that too, point distributionUrl at the local zip instead:
#   distributionUrl=file\:///D:/path/to/gradle-9.8.1-bin.zip
#   validateDistributionUrl=false
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.1-bin.zip
distributionSha256Sum=dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
