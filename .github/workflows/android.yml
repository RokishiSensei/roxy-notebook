name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The release build falls back to the debug signing key when keystore/keystore.properties
      # is missing, which is exactly what happens on CI (the real key is never published).
      - name: Unit tests
        run: ./gradlew --console=plain :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --console=plain :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
