name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # The runner image already ships an Android SDK at this location; we install the
      # few packages this project needs on top of it instead of letting a setup action
      # take over $ANDROID_HOME.
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show toolchain versions
        run: |
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT" || true

      - name: Install the SDK packages this project needs
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"; ls -R "$ANDROID_SDK_ROOT/cmdline-tools" || true
            exit 1
          fi
          # compileSdk / targetSdk 37 and the matching build-tools. --licenses is answered
          # by yes(1) because sdkmanager refuses to install without accepted licences.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" || {
            echo "android-37 unavailable, falling back to 36 + build-tools 36.0.0"
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          }
          "$SDKMANAGER" --list_installed | sed -n '1,40p'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The release build falls back to the debug signing key when keystore/keystore.properties
      # is absent, which is what happens here (the real key is never published).
      - name: Unit tests
        run: ./gradlew --console=plain :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --console=plain :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --console=plain :app:assembleDebug

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
