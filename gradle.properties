# 3072m rather than 4096m: D8/R8 dexing forks workers, and on a 4-core CI runner a 4 GB heap plus
# several parallel workers runs out of memory ("java.lang.OutOfMemoryError: Java heap space" in
# :app:mergeExtDexDebug). The limits below keep the build inside a 16 GB runner.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
# Dexing and Kotlin compilation each hold their own heap, so cap how many run at once.
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx1536m

android.useAndroidX=true
android.nonTransitiveRClass=true
# Silences AGP's conservative check for non-ASCII project paths (the original
# checkout lived under D:\安卓app). Harmless on ASCII paths, so it is kept for portability.
android.overridePathCheck=true

kotlin.code.style=official
